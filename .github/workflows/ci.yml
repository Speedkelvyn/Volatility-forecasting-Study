name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest numpy pandas scipy "scikit-learn>=1.6,<1.10" statsmodels arch
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
